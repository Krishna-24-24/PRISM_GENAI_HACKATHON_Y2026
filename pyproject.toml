[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceiq"
version = "0.1.0"
description = "TRACEIQ Adaptive Agentic Code Retrieval Ranking Engine"
authors = [{name = "Krishna"}]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "black>=24.4.2",
    "isort>=5.13.2",
    "flake8>=7.1.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0"
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
